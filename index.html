<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu Trompette</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #fff;
    color: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

* { box-sizing: border-box; }

h1 {
    font-size: 2em;
    margin-top: 10px;
}

/* ---------------- BUTTONS ---------------- */
button {
    width: auto;
    padding: 20px 25px;
    min-width: 100px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    background: #444;
    color: white;
    margin: 5px;
}

button.active { background: orange; }

.mode-btn {
    min-width: 250px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 15px;
    max-width: 100%;
}


/* ---------------- MENU ---------------- */
#modeSelection {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    margin-top: 30px;
}

/* ---------------- GAME ---------------- */
#note {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-height: 250px;
}

#note img {
    width: 100%;
    max-width: 180px;
    border: 1px solid #ccc;
}

#noteText {
    font-size: 20px;
    font-weight: bold;
}

#remaining, #timer, #result {
    font-size: 20px;
    margin: 5px;
}

/* ---------------- SCORES SCREEN ---------------- */
#gameContainer, #scoresScreen {
    margin-top: 30px;
}

#scoresScreen {
    display: none;
}

/* titre */
#scoreTitle {
    margin-bottom: 10px;
}

/* score actuel */
#currentScore {
    background: #ffd700;
    margin: 10px auto;
    padding: 20px;
    width: 95%;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
}

#currentScoreValue {
    font-size: 32px;
    font-weight: bold;
    color: #111;
}

#currentScoreRank{
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #444;
}

/* liste */
#scoresList {
    max-height: 350px;
    overflow-y: auto;
    margin: 15px auto;
}

/* SCORE ITEM (RESTE IDENTIQUE À TON ANCIEN DESIGN) */
.score-item {
    background: #f0f0f0;
    margin: 10px auto;
    padding: 10px;
    width: 95%;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
}

.score-item.new-score {
    background: #ffd700;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

.score-line {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 0.9em;
}

.score-date {
    font-size: 0.75em;
    color: #444;
    font-weight: 400;
}

/* ---------------- RESPONSIVE ---------------- */
@media (max-width: 600px) {

    /* MODE 1 : garder 1 2 3 sur une ligne */
    #gameContainer:not(.mode2) .buttons {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
    }

    #gameContainer:not(.mode2) .buttons button {
        flex: 0 0 auto;
        min-width: 80px;
        font-size: 18px;
        padding: 18px;
    }
}

/* ===== MODE 2 (clavier en 2 lignes propre) ===== */

#gameContainer.mode2 .buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
}

#gameContainer.mode2 .mode2-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

#gameContainer.mode2 .mode2-row button {
    min-width: 70px;
    padding: 12px 14px;
    font-size: 16px;

}

.sound-btn {
    position: fixed;
    top: 10px;
    right: 10px;

    font-size: 26px;

    background: transparent;
    border: none;

    padding: 0;

    cursor: pointer;

    z-index: 9999;

    transition: transform 0.15s ease, opacity 0.2s ease;

    color: #111;
}

.sound-btn:hover {
    transform: scale(1.1);
}

.sound-btn.off {
    opacity: 0.35;
}

</style>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 🎺 FAVICON -->
<script>
(function() {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.font = '24px serif';
    ctx.fillText('🎺', 4, 24);

    const link = document.createElement('link');
    link.rel = 'icon';
    link.href = canvas.toDataURL();
    document.head.appendChild(link);
})();
</script>
</head>
<body>

<button id="soundToggle" onclick="toggleSound()" class="sound-btn">
    🔊
</button>

<!-- MENU -->
<div id="modeSelection">

    <h2>🎺 Doigtés</h2>
<button onclick="startMode('fixed')">20 notes à deviner</button>
<button onclick="startMode('chrono')">Max notes en 1 minute</button>

<h2>🎵 Lecture</h2>
<button onclick="startMode('mode2')">Nommer les notes (30s)</button>

</div>

<!-- GAME -->
<div id="gameContainer" style="display:none;">
    <div id="remaining"></div>
    <div id="timer"></div>

    <div id="note">
        <img id="noteImage" src="" alt="note">
        <span id="noteText"></span>
    </div>

    <div class="buttons">
    <button 
        onmousedown="press(1)" 
        onmouseup="release(1)" 
        ontouchstart="press(1)" 
        ontouchend="release(1)"
        ontouchcancel="release(1)">
        1
    </button>

    <button 
        onmousedown="press(2)" 
        onmouseup="release(2)" 
        ontouchstart="press(2)" 
        ontouchend="release(2)"
        ontouchcancel="release(2)">
        2
    </button>

    <button 
        onmousedown="press(3)" 
        onmouseup="release(3)" 
        ontouchstart="press(3)" 
        ontouchend="release(3)"
        ontouchcancel="release(3)">
        3
    </button>
</div>

    <div id="result"></div>
</div>

<!-- SCORES -->
<div id="scoresScreen">
    <h2 id="scoreTitle">Résultats</h2>

    <div id="currentScore">
        <div id="currentScoreRank">-</div>
        <div id="currentScoreValue">-</div>
    </div>

    <div id="scoresList"></div>

    <div class="buttons">
        <button onclick="replayGame()">Rejouer</button>
        <button onclick="backToMenu()">Retour à l'accueil</button>
    </div>
</div>

<!-- SCRIPTS -->
<script src="js/data.js"></script>
<script src="js/scores.js"></script>
<script src="js/mode1.js"></script>
<script src="js/mode2.js"></script>
<script src="js/mode3.js"></script>
<script src="js/mode4.js"></script>
<script src="js/mode5.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
